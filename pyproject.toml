[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drive2sim"
version = "0.1.0"
description = "Driving-scene reconstruction for simulation, built on DriveStudio"
readme = "README.md"
requires-python = ">=3.9"
# Heavy dependencies (PyTorch, gsplat-geer, ...) are installed from requirements.txt.

[tool.setuptools.packages.find]
include = ["drive2sim*"]
namespaces = true

[tool.setuptools.package-data]
drive2sim = ["assets/**/*", "configs/**/*"]
