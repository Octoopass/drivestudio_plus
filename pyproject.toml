[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drive2sim"
version = "0.1.0"
description = "Driving-scene reconstruction for simulation, built on DriveStudio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5,<3", "pyyaml>=6"]

[project.scripts]
d2s = "drive2sim.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
# Studio: API (CONTRACTS mục 11) và lệnh d2s studio.
studio = ["fastapi>=0.110", "uvicorn>=0.29"]
# Chạy run trên Kaggle: tool gọi lệnh kaggle (đã kiểm cờ với Kaggle CLI 2.2.5).
kaggle = ["kaggle>=2.2,<3"]
# Heavy dependencies (PyTorch, gsplat-geer, ...) are installed from requirements.txt.

[tool.setuptools.packages.find]
include = ["drive2sim*"]
namespaces = true

[tool.setuptools.package-data]
drive2sim = ["assets/**/*", "configs/**/*", "approaches/*.yaml", "kaggle/templates/*", "sim/server/protos/*", "studio/frontend/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99
target-version = "py39"
# Mã cũ lấy từ DriveStudio và mã bên thứ ba chưa theo chuẩn này (AGENTS.md mục 4).
extend-exclude = ["drive2sim/recon", "third_party", "drive2sim/kaggle/templates"]

[tool.ruff.lint]
# E/W: PEP 8; F: lỗi logic; I: thứ tự import; N: đặt tên PEP 8; ANN: chú thích kiểu;
# D: docstring (quy ước Google); B: lỗi hay gặp; UP: cú pháp hiện đại hợp với Python 3.9.
select = ["E", "W", "F", "I", "N", "ANN", "D", "B", "UP"]
ignore = [
    "D105",  # phương thức đặc biệt (__repr__, ...) không bắt buộc docstring
    "D107",  # docstring đặt ở lớp thay vì __init__
    "N815",  # tên trường T_a_b theo quy ước toạ độ (CONTRACTS mục 10.3)
    "N802", "N803", "N806",  # như trên, cho hàm, tham số, biến
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Hàm test đặt tên mô tả rõ hành vi nên không bắt buộc docstring (AGENTS.md mục 4.3).
"tests/**" = ["D103"]
"**/__init__.py" = ["D104"]
# Dữ liệu mẫu viết thành bảng, mỗi mục một dòng cho dễ đọc và sửa.
"drive2sim/scripts/make_demo.py" = ["E501"]
