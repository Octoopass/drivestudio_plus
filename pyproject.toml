[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drive2sim"
version = "0.1.0"
description = "Driving-scene reconstruction for simulation, built on DriveStudio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5,<3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Heavy dependencies (PyTorch, gsplat-geer, ...) are installed from requirements.txt.

[tool.setuptools.packages.find]
include = ["drive2sim*"]
namespaces = true

[tool.setuptools.package-data]
drive2sim = ["assets/**/*", "configs/**/*", "approaches/*.yaml", "kaggle/templates/*", "sim/server/protos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
