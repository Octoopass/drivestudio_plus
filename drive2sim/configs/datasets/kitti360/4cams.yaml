# KITTI-360 dataset configuration (drive2sim; scene written by drive2sim/ingest/kitti360.py)
# Processed cameras (camera model and size are read from the scene's manifest.yaml):
#   idx    camera     model            original size (h, w)
#    0    image_00    opencv_pinhole   (376, 1408)
#    1    image_01    opencv_pinhole   (376, 1408)
#    2    image_02    opencv_fisheye   (1400, 1400)
#    3    image_03    opencv_fisheye   (1400, 1400)
# Fisheye cameras are rendered natively (no undistortion): they need render_mode ut or geer
# (recon/trainers/base.py); pixels beyond MEI_FIT_MAX_ANGLE (drive2sim/core/camera.py) are
# excluded from the loss.

data:
  data_root: data/kitti360/processed # data root for the dataset
  dataset: kitti360 # dataset type
  scene_idx: 0 # which scene to use
  start_timestep: 0 # which timestep to start from
  end_timestep: -1 # which timestep to end at, -1 means the last timestep
  preload_device: cuda # choose from ["cpu", "cuda"], cache the data on this device
  pixel_source: # image source and object annotations
    type: drive2sim.recon.data.loaders.standard.StandardPixelSource
    cameras: [0, 1, 2, 3] # which cameras to use
    # Same factor 2 as kitti/2cams (1242x375 -> 621x187) and physicalai (1920x1080 -> 960x540):
    # pinhole 1408x376 -> 704x188, fisheye 1400x1400 -> 700x700 (about as many pixels per
    # camera as physicalai at factor 2). The list is indexed by position in `cameras`, and every
    # entry is 2, so any camera selection keeps the same factor.
    downscale_when_loading: [2, 2, 2, 2] # the size of the images to load
    downscale: 1 # downscale factor wrt to the downscale_when_loading
    undistort: False # fisheye cameras are trained on the original images only
    test_image_stride: 0 # use every Nth timestep for the test set. if 0, use all images for training and none for testing
    load_sky_mask: True # whether to load sky mask
    load_dynamic_mask: True # whether to load dynamic mask
    load_objects: True # whether to load object bounding boxes
    load_smpl: True # whether to load SMPL for pedestrians; train.drivestudio turns it off when the scene has no humanpose/smpl.pkl
    sampler: # error based image sampler
      buffer_downscale: 8 # downscale factor for the buffer wrt load_size
      buffer_ratio: 0.5 # the percentage of images sampled according to the error buffer
      start_enhance_weight: 3 # give more chance to sample starting frames, which usually have more errors
  lidar_source: # everything related to "lidar" --- from lidar points
    type: drive2sim.recon.data.loaders.kitti.KITTILiDARSource # same lidar/<frame>.bin layout as KITTI
    load_lidar: True # whether to load lidar
    # ---- compute aabb from lidar ---- #
    # if load_lidar is True, we compute aabb from lidar, otherwise we compute aabb from cameras
    # 1) downsample lidar by random sampling to 1/lidar_downsample_factor number of points
    # 2) compute aabb from the downsampled lidar points by using the percentile of lidar_percentiles
    lidar_downsample_factor: 4 # downsample lidar by this factor to compute percentile
    lidar_percentile: 0.02  # percentile to compute aabb from lidar

# dataset specific configurations (same as kitti)
model:
  RigidNodes:
    ctrl:
      stop_split_at: 30000
