# DeformableGS rendered with 3DGEER (Bosch 3DGEER patch), e.g. for fisheye cameras. CamPose removed: 3DGEER cannot
# optimise camera poses. densify_grad_thresh and refine_interval as in omnire_geer.yaml (Bosch value for the GEER
# densification statistic; refine_interval 50 measured on OmniRe only). Untested with DeformableGS.
# Kế thừa deformablegs_nocampose.yaml bằng extends (CONTRACTS mục 10.5).
extends: deformablegs_nocampose.yaml
trainer:
  render:
    render_mode: geer # one of default | ut | geer
  gaussian_ctrl_general_cfg:
    refine_interval: 50           # refine gaussians every n steps (Bosch: 300)
    densify_grad_thresh: 0.01     # threshold for the GEER densification statistic
