# BezierGS (ICCV 2025, LogosIntelligenceLab/BezierGS, MIT, commit 6df0a36) trên khung DriveStudio:
# nền 3DGS thường, vật động là các nhóm Gaussian đi theo đường Bézier bậc 3 (BezierNodes thay
# RigidNodes), có thêm ba loss của BezierGS (trainers/bezier.py). Viết đầy đủ, không extends: khác
# streetgs.yaml ở trainer, losses, ngưỡng densify, node vật động, và bỏ CamPose (BezierGS gốc tắt
# pose correction). Cần mask vật động (data.pixel_source.load_dynamic_mask: True) và box 3D.
# Chỗ khác bản gốc: docs/methods/beziergs.md. Chưa chạy thật trên GPU.
seed: 0
dataset: waymo/3cams

# ------------- Trainer ------------ #
trainer:
  type: drive2sim.recon.trainers.BezierTrainer
  optim:
    num_iters: 30000
    use_grad_scaler: false
    cache_buffer_freq: -1 # if > 0, use error based image sampler for training
  render:
    near_plane: 0.1 # near plane for rendering
    far_plane: 10000000000.0 # far plane for rendering
    antialiased: false # whether to use antialiasing for gaussian rendering, supported by gsplat kernel
    packed: false # whether to use packed rendering, supported by gsplat kernel
    absgrad: false # whether to use absolute gradient for rendering, supported by gsplat kernel
    sparse_grad: false # whether to use sparse gradient for rendering, supported by gsplat kernel
    batch_size: 1 # batch size for rendering, currently only support 1
  losses:
    rgb:
      w: 0.8
    ssim:
      w: 0.2
    mask:
      w: 0.05 # opacity vùng trời
      opacity_loss_type: bce # choose from [bce, safe_bce]
    depth:
      w: 1.0 # loss LiDAR |1/d_lidar - 1/d_pred| của BezierGS
      inverse_depth: True # whether to use inverse depth, NOTE that when set to True, must normalize=True
      normalize: True # whether to normalize depth loss
      loss_type: l1 # choose from ["l1", "l2"]
      lidar_w_decay: 1.0 # nhân exp(-step / 8000), như BezierGS
    inverse_depth_smoothness:
      w: 0.1
    affine:
      w: 0.00001 # weight of affine regularization
    bezier_dynamic:
      w: 0.1 # ảnh chỉ vẽ vật động so với ảnh thật nhân mask động (L1, SSIM, alpha)
    bezier_velocity:
      w: 1.0 # vận tốc của Gaussian ở pixel tĩnh
    bezier_icc:
      w: 0.01 # độ dài độ lệch của Gaussian vật động giữ gần chuẩn
  res_schedule:
    double_steps: 250 # training starts at 1/d resolution, every n steps this is doubled
    downscale_times: 2 # at the beginning, resolution is 1/2^d, where d is this number
  gaussian_optim_general_cfg:
    xyz:
      # LR theo mét của BezierGS gốc trên cảnh Waymo 017: 1.6e-3 × extent 0.908 × 18.44 m mỗi đơn
      # vị chuẩn hoá ≈ 0.0268 m, chia scene_radius 38.4 m của DriveStudio ra 7.0e-4 (docs/methods/
      # beziergs.md). Hệ số này phụ thuộc cảnh; cảnh khác cần tính lại.
      lr: 7.0e-04
      lr_final: 7.0e-06
      scale_factor: scene_radius # str or float, if "scene_scale", scale the learning rate by the scene scale
    sh_dc:
      lr: 0.0025
    sh_rest:
      lr: 0.000125
    opacity:
      lr: 0.05 # BezierGS gốc 0.005, nhưng run 3 (0.005 và trần 5M điểm) kém hơn run 2
    scaling:
      lr: 0.005
    rotation:
      lr: 0.001
  gaussian_ctrl_general_cfg:
    warmup_steps: 500             # warmup steps for alpha
    reset_alpha_interval: 3000    # reset alpha every n steps
    refine_interval: 100          # refine gaussians every n steps
    sh_degree_interval: 2000      # every n intervals turn on another sh degree
    n_split_samples: 2            # number of samples to split gaussians into
    # may differ in different models
    reset_alpha_value: 0.01       # reset alpha to this value
    densify_grad_thresh: 0.00017  # above this grad, gaussians are densified
    densify_size_thresh: 0.003   # below this size, gaussians are *duplicated*, otherwise split
    cull_alpha_thresh: 0.005       # threshold of opacity for culling gaussians
    cull_scale_thresh: 0.5        # threshold of scale for culling gaussians
    cull_screen_size: 0.15        # if a gaussian is more than this percent of screen space, cull it
    split_screen_size: 0.05       # if a gaussian is more than this percent of screen space, split it
    stop_screen_size_at: 4000     # stop culling/splitting at this step WRT screen size of gaussians
    stop_split_at: 15000          # stop splitting at this step
    sh_degree: 3                  # sh degree for gaussians

# ------------- Model ------------ #
model:
  Background:
    type: drive2sim.recon.models.gaussians.VanillaGaussians
    init:
      from_lidar:
        num_samples: 263_000 # BezierGS gốc khởi tạo 252.912 điểm LiDAR cho nền (600_000 cho ra 577 nghìn)
        return_color: True
      near_randoms: 100_000
      far_randoms: 100_000
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.       # threshold of ratio of gaussian max to min scale before applying regularization loss from the PhysGaussian paper
  BezierNodes:
    type: drive2sim.recon.models.nodes.BezierNodes
    init:
      instance_max_pts: 20000 # max initial points for each instance
      only_moving: true # only optimize moving instances
      traj_length_thres: 2.0 # threshold of trajectory length for moving instances
    bezier:
      order: 3 # bậc Bézier: 4 control point
      min_instance_pts: 30 # vật ít điểm hơn bị bỏ
      opacity_init: 0.01
      fit_rounds: 100 # số vòng lặp tối đa khi fit đường đi
    ctrl:
      cull_scale_thresh: 0.1
      stop_screen_size_at: 30000
      stop_split_at: 15000 # densify tới 15000 bước như BezierGS
      cull_out_of_bound: false # BezierNodes bỏ qua khoá này (Gaussian không còn toạ độ trong hệ box)
    reg:
      sharp_shape_reg:
        w: 1.
        step_interval: 10
        max_gauss_ratio: 10.
    optim:
      traj: # tâm vật; giữ tỉ lệ 0.01 so với xyz như BezierGS
        lr: 7.0e-6
        lr_final: 7.0e-8
        scale_factor: scene_radius
      bezier_param: # đa thức đổi thời gian sang tham số Bézier
        lr: 1.0e-5
  Sky:
    type: drive2sim.recon.models.modules.EnvLight
    params:
      resolution: 1024
    optim:
      all:
        lr: 0.01
  Affine:
    type: drive2sim.recon.models.modules.AffineTransform
    params:
      embedding_dim: 4
      base_mlp_layer_width: 64
      pixel_affine: False
    optim:
      all:
        lr: 5.0e-4 # BezierGS gốc: color correction theo sensor, 5e-4 giảm về 5e-5 (bản đầu 1e-5)
        lr_final: 5.0e-5
        weight_decay: 1.0e-6

# ------------- render ------------ #
render:
  fps: 10 # frames per second for the main rendered output
  render_full: True # whether to render full resolution videos
  render_test: True # whether to render test set
  render_novel: 
    traj_types:
      - front_center_interp # type of trajectory for novel view synthesis
    fps: 24 # frames per second for novel view rendering
  vis_lidar: False # whether to visualize lidar points on ground truth images
  vis_sky: False # whether to include "rgb_sky" and "rgb_sky_blend" in rendered keys
  vis_error: False # whether to include "rgb_error_map" in rendered keys

# ------------- logging ------------ #
logging:
  vis_freq: 2000 # how often to visualize training stats
  print_freq: 500 # how often to print training stats
  saveckpt_freq: 15000 # how often to save checkpoints
  save_seperate_video: True # whether to save seperate videos for each scene