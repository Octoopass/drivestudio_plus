# OmniRe rendered with 3DGEER (Bosch 3DGEER patch). CamPose removed: 3DGEER cannot optimise camera poses.
# densify_grad_thresh / refine_interval are Bosch's values for the GEER densification statistic.
# Kế thừa omnire_nocampose.yaml bằng extends (CONTRACTS mục 10.5).
extends: omnire_nocampose.yaml
trainer:
  render:
    render_mode: geer # one of default | ut | geer
  gaussian_ctrl_general_cfg:
    refine_interval: 300          # refine gaussians every n steps
    densify_grad_thresh: 0.01     # threshold for the GEER densification statistic
