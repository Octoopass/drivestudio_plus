# Street Gaussians rendered with 3DGEER (gsplat-geer fork, render_mode: geer). CamPose removed: 3DGEER cannot
# optimise camera poses. densify_grad_thresh / refine_interval follow Bosch's omnire_geer.yaml (0.01 / 300):
# with the 3DGS defaults (0.0005 / 100) the background grew to 5.4M Gaussians by step 1500 and ran out of memory on a T4.
# Kế thừa streetgs_nocampose.yaml bằng extends (CONTRACTS mục 10.5).
extends: streetgs_nocampose.yaml
trainer:
  render:
    render_mode: geer # one of default | ut | geer (key added by the Bosch 3DGEER patch)
  gaussian_ctrl_general_cfg:
    refine_interval: 300          # refine gaussians every n steps
    densify_grad_thresh: 0.01   # above this grad, gaussians are densified
