# so that default / ut / geer runs differ only in the renderer. Densification values are the 3DGS defaults. Untested.
# Kế thừa streetgs_nocampose.yaml bằng extends (CONTRACTS mục 10.5).
extends: streetgs_nocampose.yaml
trainer:
  render:
    render_mode: ut # one of default | ut | geer (key added by the Bosch 3DGEER patch)
