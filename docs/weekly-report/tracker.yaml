      - {id: YEU-CAU-PHAM-VI, viec: "Đặc tả yêu cầu, deliverables, phạm vi M0–M5", ghi_chu: "8 nhóm yêu cầu, 6 deliverable; chờ mentor xác nhận", trang_thai: xong}
      - {id: KIEN-TRUC, viec: "Kiến trúc tham chiếu 5 subsystem và luồng dữ liệu", ghi_chu: "5 subsystem, 2 giai đoạn offline và online", trang_thai: xong}
      - {id: THIET-KE-TOOL, viec: "Thiết kế tool thử nghiệm: chuẩn hoá cách nối các method", ghi_chu: "Chuẩn hoá dữ liệu, contract, metric; không chuẩn hoá thuật toán", trang_thai: xong}
