# Bảng công việc dùng chung cho mọi báo cáo tuần (bản gốc duy nhất).
#
# Cách cập nhật mỗi tuần (xem template/README.md):
#   1. Trong tuần NN: chép mọi việc của `ke_hoach` vào `cong_viec`, cộng các việc tuần NN-1 còn
#      `dang-lam`, rồi đặt trạng thái thật cuối tuần. Việc phát sinh thêm thì thêm dòng.
#   2. Thêm tuần NN+1 với `ke_hoach` là việc dự kiến (chưa có `cong_viec`).
#   3. Không xoá dòng của tuần cũ. Việc bỏ thì để `dung` ở tuần bỏ.
#
# trang_thai: xong (xanh lá) | dang-lam (vàng) | dung (đỏ: bị chặn hoặc bỏ) | ke-hoach (xám)
# id: khoá nội bộ để nối cùng một việc qua các tuần; KHÔNG hiện trong báo cáo (báo cáo chỉ hiện `viec`).
# viec: ghi tổng quát; chi tiết để ở mục kết quả của báo cáo tuần.

lo_trinh:
  - nhom: Mốc của dự án (kế hoạch tổng thể)
    muc:
      - {id: M0, ten: "Kiến trúc, interface, contract"}
      - {id: M1, ten: "Chạy được dựng cảnh đến đánh giá"}
      - {id: M2, ten: "Benchmark nhiều phương pháp"}
      - {id: M3, ten: "Thế giới sẵn sàng cho mô phỏng"}
      - {id: M4, ten: "Closed-loop simulation"}
      - {id: M5, ten: "Nền tảng mở rộng được"}
  - nhom: Track benchmark (ba bảng xếp hạng riêng)
    muc:
      - {id: A, ten: "Dựng từng cảnh (per-scene optimization)"}
      - {id: B, ten: "Quãng đường dài ≥ 1 km (long-drive)"}
      - {id: C, ten: "Dựng tức thì (feed-forward)"}

